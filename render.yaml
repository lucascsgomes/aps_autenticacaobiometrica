# Blueprint do Render: a API e o reconhecimento facial, os dois no plano grátis (512 MB cada; o face-service usa cerca de 200 MB).
# Os valores marcados com sync: false são pedidos na criação e nunca ficam no repositório.
services:
  # O nome banco-api é o do serviço que já existe no Render (a URL dele depende disso): renomear aqui cria outro serviço.
  - type: web
    name: banco-api
    runtime: docker
    dockerfilePath: ./src/Ministerio.Api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ConnectionStrings__Dados # connection string do Neon (com SSL Mode=Require)
        sync: false
      - key: Jwt__Chave # sorteada pelo Render, mínimo de 32 caracteres
        generateValue: true
      - key: Biometria__ChaveCifra # 32 bytes em base64; perdeu a chave, perdeu os rostos cadastrados
        sync: false
      - key: Face__ChaveInterna # a mesma chave do face-service, copiada dele
        fromService:
          type: web
          name: face-service
          envVarKey: FACE_INTERNAL_KEY
      - key: Admin__Cpfs__0 # CPF (só dígitos) do administrador fixo: ele muda níveis e admins no painel; para mais, crie Admin__Cpfs__1, __2... no painel
        sync: false
      # Face__BaseUrl (a URL pública do face-service) entra à mão, depois do primeiro deploy: veja o README.
      - key: Cors__Origens__0 # origem da interface web (GitHub Pages), sem barra no fim
        value: https://lucascsgomes.github.io

  - type: web
    name: face-service
    runtime: docker
    dockerfilePath: ./face-service/Dockerfile
    dockerContext: ./face-service
    plan: free
    healthCheckPath: /internal/v1/health
    envVars:
      - key: FACE_INTERNAL_KEY # sorteada pelo Render; sem ela as rotas biométricas respondem 401
        generateValue: true
