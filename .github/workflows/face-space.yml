name: Publicar face-service no Hugging Face

on:
  push:
    branches: [main]
    paths:
      - face-service/**
      - .github/workflows/face-space.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Envia a pasta face-service para o Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          test -n "$HF_TOKEN" && test -n "$HF_SPACE" || { echo "Defina o secret HF_TOKEN e a variável HF_SPACE (usuario/nome-do-space)."; exit 1; }
          git clone "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" space
          rsync -a --delete \
            --exclude .git --exclude .venv --exclude modelos --exclude tests \
            --exclude '__pycache__' --exclude '.*_cache' \
            face-service/ space/
          # O Space lê a configuração do cabeçalho do README.
          {
            printf -- '---\ntitle: Face Service\ncolorFrom: blue\ncolorTo: gray\nsdk: docker\napp_port: 7860\npinned: false\n---\n\n'
            cat face-service/README.md
          } > space/README.md
          cd space
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Nada mudou."; exit 0; }
          git commit -m "Atualiza o face-service (${GITHUB_SHA::7})"
          git push
